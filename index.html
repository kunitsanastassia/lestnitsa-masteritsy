<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лестница мастерицы</title><style>
*{box-sizing:border-box}body{margin:0;background:#03160d;font-family:Georgia,"Times New Roman",serif;color:#3a230d}.stage{position:relative;width:min(1280px,100vw);margin:auto}.bg{display:block;width:100%;height:auto}.form{position:absolute;left:24.5%;top:39%;width:31%;padding:1.5%;text-align:left}.field{margin:0 0 4%}.field label{display:block;font-weight:bold;font-size:clamp(12px,1.25vw,18px);margin:0 0 1.5%}.field input{width:100%;padding:3.3% 4%;border:1px solid #9a6b25;border-radius:8px;background:rgba(255,249,224,.94);box-shadow:inset 0 1px 4px #8b682533;font:clamp(12px,1.35vw,18px) Georgia;color:#3a230d;outline:none}.field input:focus{box-shadow:0 0 0 2px #c99535,inset 0 1px 4px #8b682533}.go{width:100%;padding:3.7% 2%;border:2px solid #d6a33b;border-radius:10px;background:linear-gradient(#17643c,#063b24);color:#ffe6a0;font:bold clamp(12px,1.35vw,19px) Georgia;cursor:pointer;box-shadow:0 5px 12px #321a0b55}.go:hover{filter:brightness(1.1);transform:translateY(-1px)}.note{text-align:center;font-size:clamp(9px,.85vw,13px);margin-top:3%;color:#60401d}
@media(max-width:650px){
 body{background:#03160d}
 .stage{width:100%;overflow:hidden}
 picture{display:block;width:100%}
 .bg{display:block;width:100%;height:auto}
 .form{position:absolute;left:19.2%;top:43.7%;width:61.6%;padding:0;text-align:left}
 .field{margin:0 0 3.1%}
 .field label{display:block;font-weight:bold;font-size:3.55vw;line-height:1.1;margin:0 0 1.2%;color:#4a2a12}
 .field input{width:100%;height:9.6vw;min-height:38px;padding:0 3.5%;font-size:3.75vw;border:1px solid #9a6b25;border-radius:8px;background:#fff9e0;box-shadow:inset 0 1px 3px #8b682533}
 .go{width:100%;height:12.7vw;min-height:50px;margin-top:.5%;padding:0 2%;border:2px solid #d6a33b;border-radius:10px;background:linear-gradient(#17643c,#063b24);color:#ffe6a0;font:bold 4.15vw Georgia;line-height:1.05;box-shadow:0 5px 12px #321a0b55}
 .note{display:none}
}
</style></head><body><main class="stage"><picture><source media="(max-width:650px)" srcset="assets/lestnitsa-mobile-bg.png"><img class="bg" src="assets/lestnitsa-bg.png" alt="Лестница мастерицы"></picture><form class="form" id="form"><div class="field"><label for="name">Имя / ник</label><input id="name" required placeholder="Например: Анастасия"></div><div class="field"><label for="tag">Личный хэштег в игре</label><input id="tag" placeholder="Например: #вышиваю_с_любовью"></div><div class="field"><label for="date">Дата достижения вершины</label><input id="date" type="date" required></div><button class="go" type="submit">🏆 ПОЛУЧИТЬ СЕРТИФИКАТ</button><div class="note">Данные используются только для создания сертификата.</div></form></main><script>
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const data={name:document.getElementById("name").value.trim(),tag:document.getElementById("tag").value.trim(),date:document.getElementById("date").value};sessionStorage.setItem("lestnitsaCertificate",JSON.stringify(data));window.location.assign("certificate.html?"+new URLSearchParams(data).toString())});
</script></body></html>
