<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сертификат — Лестница мастерицы</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071d12;font-family:Georgia,"Times New Roman",serif;color:#48270f;padding:24px 12px 36px}
.wrap{width:min(1536px,98vw);margin:auto}.sheet{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;box-shadow:0 24px 70px #000b}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.content{position:absolute;left:20%;top:20%;width:60%;height:59%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}
.kicker{font-size:clamp(12px,1.25vw,20px);letter-spacing:.12em;font-weight:bold;color:#86571d}.title{font-size:clamp(30px,4.1vw,66px);line-height:1;margin:.5% 0 1%;font-weight:bold;color:#4a270d;letter-spacing:.04em}.subtitle{font-size:clamp(13px,1.45vw,23px);font-style:italic;margin-bottom:2%}.intro{font-size:clamp(11px,1.25vw,19px)}.name{width:82%;margin:1.2% 0 1.6%;padding:.5% 2% 1%;border-bottom:1px solid #9c6a2a;font:italic bold clamp(27px,4vw,62px) "Times New Roman",serif;color:#3b200d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{max-width:86%;font-size:clamp(12px,1.4vw,22px);line-height:1.38}.peak{font-weight:bold;color:#70420f}.motto{margin-top:2.2%;font-size:clamp(11px,1.3vw,20px);font-weight:bold}.meta{width:82%;display:flex;justify-content:space-between;gap:16px;margin-top:3%;font-size:clamp(10px,1.1vw,17px);font-weight:bold}.actions{text-align:center;margin-top:20px}.actions button,.actions a{display:inline-block;margin:5px;padding:12px 22px;border:1px solid #d5a344;border-radius:8px;background:#0b4b2c;color:#ffe4a0;font:bold 15px Georgia;text-decoration:none;cursor:pointer}.actions button:hover,.actions a:hover{filter:brightness(1.12)}
@media(max-width:650px){
 body{padding:0 0 28px;overflow-x:hidden}
 .wrap{width:100%;margin:0}
 .sheet{width:100%;aspect-ratio:9/16;box-shadow:none}
 .cert-picture{position:absolute;inset:0;display:block}
 .bg{width:100%;height:100%;object-fit:cover}
 .content{position:absolute;left:20%;top:39%;width:60%;height:38.5%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start;color:#48270f}
 .kicker,.title,.subtitle{display:none}
 .intro{font-size:3.25vw;line-height:1.15;margin:0 0 2.2%}
 .name{width:88%;margin:0 0 2.8%;padding:0 1% 1%;border-bottom:1px solid #9c6a2a;font:italic bold 5.8vw "Times New Roman",serif;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .body{max-width:94%;font-size:3.25vw;line-height:1.22}
 .motto{max-width:94%;margin-top:3%;font-size:3.05vw;line-height:1.18;font-weight:bold}
 .meta{width:94%;display:flex;flex-direction:column;align-items:center;gap:1.1vw;margin-top:3.2%;font-size:2.85vw;line-height:1.15;font-weight:bold}
 .meta span{display:block;max-width:100%;overflow-wrap:anywhere}
 #date:empty,#tag:empty{display:none}
 .actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px;padding:0 18px}
 .actions button,.actions a{width:min(88%,390px);margin:0;padding:14px 12px;font-size:15px}
}
@media print{body{padding:0;background:#fff}.wrap{width:100%}.sheet{box-shadow:none}.actions{display:none}@page{size:landscape;margin:0}}
</style><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script></head><body><main class="wrap"><section class="sheet" id="certificate"><picture class="cert-picture"><source media="(max-width:650px)" srcset="assets/certificate-mobile-bg.png"><img class="bg" src="assets/certificate-bg.png" alt=""></picture><div class="content">
<div class="kicker">ЛЕСТНИЦА МАСТЕРИЦЫ</div><div class="title">СЕРТИФИКАТ</div><div class="subtitle">о покорении вершины</div>
<div class="intro">Настоящим подтверждается, что</div><div class="name" id="name">Участница</div>
<div class="body">прошла все 100 ступеней вышивальной игры<br>«Лестница мастерицы» и достигла <span class="peak">ВЕРШИНЫ!</span></div>
<div class="motto">100 ступенек. Тысячи крестиков. Одна Вершина.</div>
<div class="meta"><span id="date"></span><span id="tag"></span></div>
</div></section><div class="actions"><button type="button" id="download">⬇ СКАЧАТЬ СЕРТИФИКАТ PNG</button><a href="index.html">← ВЕРНУТЬСЯ</a></div></main>
<script>
const p=new URLSearchParams(location.search);
let saved={};try{saved=JSON.parse(sessionStorage.getItem("lestnitsaCertificate")||"{}")}catch(e){}
const name=(p.get("name")||saved.name||"Участница").trim();
const tag=(p.get("tag")||saved.tag||"").trim();
const d=p.get("date")||saved.date||"";
document.getElementById("name").textContent=name;
document.getElementById("tag").textContent=tag;
if(d){const [y,m,day]=d.split("-");document.getElementById("date").textContent="Дата достижения вершины: "+day+"."+m+"."+y}

document.getElementById("download").addEventListener("click",async()=>{
 const btn=document.getElementById("download"),old=btn.textContent;btn.disabled=true;btn.textContent="Создаю PNG…";
 try{
   const el=document.getElementById("certificate");
   const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:null,logging:false});
   canvas.toBlob(blob=>{
     if(!blob){alert("Не удалось создать PNG.");return;}
     const url=URL.createObjectURL(blob),a=document.createElement("a");
     a.href=url;a.download="lestnitsa-masteritsy-sertifikat.png";
     document.body.appendChild(a);a.click();a.remove();
     setTimeout(()=>URL.revokeObjectURL(url),2000);
   },"image/png");
 }catch(e){alert("Не удалось создать PNG. Попробуйте ещё раз.");}
 finally{btn.disabled=false;btn.textContent=old;}
});
</script></body></html>
